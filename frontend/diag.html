<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vic Chatbot diagnostics</title>

    <style>
        :root {
            --bg: #0A0A1F;
            --surface: #12122B;
            --border: #2A2A55;
            --accent: #8B5CF6;
            --text: #FFFFFF;
            --soft: #A5A5C8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.15rem;
        }

        p.lead {
            margin: 0 0 16px;
            color: var(--soft);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        pre {
            margin: 0 0 16px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.78rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .verdict {
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(139, 92, 246, 0.14);
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.45;
        }

        button {
            width: 100%;
            margin-bottom: 10px;
            padding: 14px 16px;
            border: 1px solid var(--accent);
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
        }

        button.secondary {
            background: transparent;
            color: var(--text);
        }
    </style>
</head>

<body>
    <h1>Vic Chatbot diagnostics</h1>
    <p class="lead">Run this on the device that fails. It reports the browser, the saved login and the exact response from the chat server.</p>

    <div class="verdict" id="verdict">Running checks...</div>

    <pre id="report">Collecting...</pre>

    <button id="copyButton" type="button" class="secondary">Copy report</button>
    <button id="signOutButton" type="button">Sign out of this device</button>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const SUPABASE_URL = "https://ibsyrfulsxlnitilxcaa.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_LQE8u0QjUgfAHfT3iHpbYA_miu-Dnxk";

        const API_URL = location.hostname.endsWith(".app.github.dev")
            ? location.origin.replace("-5500.", "-8000.")
            : location.hostname === "127.0.0.1" || location.hostname === "localhost"
                ? "http://127.0.0.1:8000"
                : "https://vic-chatbot-3.onrender.com";

        const lines = [];
        const say = (label, value) => lines.push(label.padEnd(22, " ") + String(value));
        const flush = () => {
            document.getElementById("report").textContent = lines.join("\n");
        };

        function storageCheck() {
            try {
                localStorage.setItem("vic-diag", "1");
                localStorage.removeItem("vic-diag");
                return "available";
            } catch (error) {
                return "BLOCKED (" + (error && error.name ? error.name : "error") + ")";
            }
        }

        async function timedFetch(url, options) {
            const started = Date.now();
            try {
                const response = await fetch(url, options);
                const body = await response.text();
                return {
                    status: response.status,
                    ms: Date.now() - started,
                    body: body.slice(0, 240)
                };
            } catch (error) {
                return {
                    status: "network error",
                    ms: Date.now() - started,
                    body: (error && error.message ? error.message : String(error))
                };
            }
        }

        async function run() {
            say("When", new Date().toISOString());
            say("Page", location.href);
            say("Origin", location.origin);
            say("Protocol", location.protocol);
            say("Browser", navigator.userAgent);
            say("Viewport", window.innerWidth + "x" + window.innerHeight);
            say("Storage", storageCheck());
            say("Server", API_URL);
            flush();

            const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

            let session = null;

            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) {
                    say("getSession", "ERROR: " + error.message);
                } else {
                    session = data.session;
                    say("getSession", session ? "session found" : "NO SESSION");
                }
            } catch (error) {
                say("getSession", "THREW: " + (error && error.message ? error.message : String(error)));
            }

            if (session) {
                const expiresAt = session.expires_at ? session.expires_at * 1000 : 0;
                const minutesLeft = Math.round((expiresAt - Date.now()) / 60000);
                say("User", session.user && session.user.email ? session.user.email : "(no email)");
                say("Token expires", minutesLeft + " min from now");
                say("Token length", session.access_token ? session.access_token.length : 0);
            }

            flush();

            const apiHealth = await timedFetch(API_URL + "/", { method: "GET" });
            say("API root", apiHealth.status + " in " + apiHealth.ms + "ms");
            say("API body", apiHealth.body.slice(0, 120));
            flush();

            if (session) {
                const history = await timedFetch(API_URL + "/conversations", {
                    headers: { Authorization: "Bearer " + session.access_token }
                });
                say("GET /conversations", history.status + " in " + history.ms + "ms");
                say("Response", history.body);
                flush();

                const verdict = document.getElementById("verdict");

                if (history.status === 200) {
                    verdict.textContent = "The chat server accepted this login. If the app still failed, reload it once with a hard refresh.";
                } else if (history.status === 401) {
                    verdict.textContent = "This device holds a login the server rejects. Sign out below, then log in again.";
                } else if (history.status === 403) {
                    verdict.textContent = "The server answered 403: " + history.body.slice(0, 120);
                } else if (history.status === "network error") {
                    verdict.textContent = "This device could not reach the chat server at all: " + history.body.slice(0, 120);
                } else {
                    verdict.textContent = "The chat server answered " + history.status + ": " + history.body.slice(0, 120);
                }
            } else {
                const verdict = document.getElementById("verdict");
                verdict.textContent = "This device has no saved login at all, which is why the app cannot load conversations. Log in on the app and run this again.";
            }

            document.getElementById("copyButton").disabled = false;
        }

        document.getElementById("copyButton").addEventListener("click", async () => {
            const text = lines.join("\n");
            try {
                await navigator.clipboard.writeText(text);
                document.getElementById("copyButton").textContent = "Copied";
            } catch (error) {
                document.getElementById("copyButton").textContent = "Copy failed, screenshot instead";
            }
        });

        document.getElementById("signOutButton").addEventListener("click", async () => {
            const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
            await supabaseClient.auth.signOut();
            document.getElementById("verdict").textContent = "Signed out on this device. Open the app and log in again.";
        });

        run();
    </script>
</body>

</html>
