<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password | Vic Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="authSection">
        <h1>Set a new password</h1>
        <p id="resetStatus" role="status">Checking your reset link...</p>

        <form id="resetPasswordForm" hidden>
            <label for="newPasswordInput">New password</label>
            <input
                id="newPasswordInput"
                type="password"
                autocomplete="new-password"
                required
            >

            <label for="confirmPasswordInput">Type the new password again</label>
            <input
                id="confirmPasswordInput"
                type="password"
                autocomplete="new-password"
                required
            >

            <button id="saveNewPasswordButton" type="submit">
                Save new password
            </button>
        </form>
    </main>

    <script type="module" src="reset.js"></script>
</body>
</html>
