<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vic Chatbot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Authentication section -->
    <div id="authSection">

        <section id="loginForm">
        <h1 class="brand-name">Vic Chatbot</h1>

        <h2>Welcome</h2>

        <input
            id="emailInput"
            type="email"
            placeholder="Enter your email"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Enter your password"
        >

        <button id="signUpButton">
            Sign Up
        </button>

        <p>Conversations may be reviewed by an admin.</p>

        <button id="loginButton">
            Log In
        </button>

        <p><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
        <p id="authMessage" role="status"></p>

        </section>

        <section id="resetRequestSection" hidden>
            <h2>Reset your password</h2>
            <form id="resetRequestForm">
                <label for="resetEmailInput">Email address</label>
                <input
                    id="resetEmailInput"
                    type="email"
                    autocomplete="email"
                    required
                >
                <button id="requestPasswordResetButton" type="submit">
                    Send reset link
                </button>
            </form>
            <p id="passwordResetMessage" role="status"></p>
            <button id="backToLoginButton" type="button">
                Back to login
            </button>
        </section>

    </div>


    <!-- Chat section -->
    <div id="chatSection" style="display: none;">

        <div id="chatLayout">
            <aside id="conversationSidebar">
                <button id="newConversationButton" type="button">
                    New chat
                </button>
                <h2>Conversations</h2>
                <p id="conversationHistoryMessage" role="status">
                    Loading conversations...
                </p>
                <ul id="conversationList"></ul>
                <div class="sidebar-footer">
                    <button id="logoutButton" type="button">
                        Log Out
                    </button>
                    <a id="adminDashboardLink" href="admin.html" hidden>
                        Admin dashboard
                    </a>
                </div>
            </aside>

            <main id="chatMain">
                <header id="chatHeader">
                    <button
                        id="mobileMenuButton"
                        type="button"
                        aria-controls="conversationSidebar"
                        aria-expanded="false"
                        aria-label="Open conversation menu"
                    >
                        Menu
                    </button>
                    <h1 class="brand-name">Vic Chatbot</h1>
                </header>

                <div id="chat"></div>

                <div id="messageArea">
                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Type your message..."
                    >

                    <button id="sendButton">
                        Send
                    </button>
                </div>
            </main>
        </div>
    </div>


    <!-- Our JavaScript -->
    <script type="module" src="script.js?v=8"></script>

</body>
</html>
